<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>整周期墙面抹涂 · 三维回放</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#e9f1f8;font:14px 'Microsoft YaHei',sans-serif}main{padding:16px;max-width:1500px;margin:auto}h1{margin:0 0 5px;font-size:23px}.sub{color:#8faac0;margin:0 0 12px}.layout{display:grid;grid-template-columns:minmax(620px,2fr) minmax(330px,1fr);gap:12px}.card{background:#0d1c2b;border:1px solid #213d52;border-radius:10px;padding:12px}canvas{width:100%;height:min(68vh,720px);display:block;background:linear-gradient(#12283a,#08131e);border-radius:7px;cursor:grab}canvas:active{cursor:grabbing}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}button,select{background:#16364d;color:#fff;border:1px solid #3b6077;border-radius:6px;padding:8px 11px}input{flex:1;accent-color:#44d5bb}.metric{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric div,.phase{padding:9px;background:#122638;border-radius:6px}.metric b{display:block;font-size:18px;color:#76e0cb}.maps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.maps canvas{height:160px;cursor:default}.legend{color:#91aabd;font-size:12px;line-height:1.55}.warn{color:#ffc16b}@media(max-width:950px){.layout{grid-template-columns:1fr}canvas{height:55vh}}
</style><main><h1>整片墙面连续强化学习闭环</h1><p class="sub">鼠标左键拖动旋转视角，滚轮缩放；回放包含回位、等待装料、接近、接触、任意方向涂抹、离墙和 D435 扫描。</p>
<div class="layout"><section class="card"><canvas id="view"></canvas><div class="controls"><button id="play">暂停</button><button id="restart">重播</button><button data-v="front">正视</button><button data-v="side">侧视</button><button data-v="iso">斜视</button><select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><span id="count"></span></div><input id="seek" type="range" min="0" value="0"></section>
<aside class="card"><div class="phase" id="phase"></div><div class="metric"><div>覆盖率<b id="coverage"></b></div><div>厚度 RMSE<b id="rmse"></b></div><div>平均厚度<b id="mean"></b></div><div>刀上余料<b id="load"></b></div><div>浪费率<b id="waste"></b></div><div>仿真步数<b id="steps"></b></div></div><div class="maps"><div><b>墙面厚度</b><canvas id="wall"></canvas></div><div><b>抹刀积料</b><canvas id="blade"></canvas></div></div><p id="action" class="legend"></p><p class="legend">颜色：深蓝=无料，青绿=目标 2 mm，橙色=过厚。白色长方形为抹刀；黄色连杆为 MuJoCo 机械臂构型。L1 软件仿真，材料为守恒的 2.5D 代理模型，D435 参数需实物标定。</p></aside></div>
<script>const D=__DATA__,F=D.frames,$=x=>document.getElementById(x);let i=0,play=true,last=0,yaw=-.65,pitch=.25,zoom=820,drag=false,lx=0,ly=0;const C=$('view'),ctx=C.getContext('2d');
function size(c){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!=r.width*d||c.height!=r.height*d){c.width=r.width*d;c.height=r.height*d}return d}function rot(p){let x=p[0]-.2,y=p[1],z=p[2]-.14,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let a=cy*x-sy*y,b=sy*x+cy*y;return [b,cp*z-sp*a,sp*z+cp*a+1]}function P(p){let r=rot(p),s=zoom/r[2];return [C.width/2+r[0]*s,C.height/2-r[1]*s,r[2]]}function line(a,b,col,w=2){a=P(a);b=P(b);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}function poly(ps,col,stroke){let q=ps.map(P);ctx.fillStyle=col;ctx.beginPath();q.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}function color(h){let t=Math.min(h/4,1);if(t<.5){let a=t*2;return `rgb(${20+25*a},${38+165*a},${62+120*a})`}let a=(t-.5)*2;return `rgb(${45+210*a},${203-28*a},${182-115*a})`}
function draw3(){size(C);ctx.clearRect(0,0,C.width,C.height);let f=F[i],wx=D.scene.wall_x,w=D.wall.width,h=D.wall.height,nv=f.wall_mm.length,nu=f.wall_mm[0].length;for(let gy=-3;gy<=3;gy++)line([-.05,gy*.1,0],[.55,gy*.1,0],'#244052',1);for(let gx=0;gx<=5;gx++)line([gx*.1,-.32,0],[gx*.1,.32,0],'#244052',1);poly([[wx,-w/2,.105],[wx,w/2,.105],[wx,w/2,.105+h],[wx,-w/2,.105+h]],'#bbb7aa','#e1ddcf');let du=w/nu,dv=h/nv;for(let r=0;r<nv;r++)for(let c=0;c<nu;c++){let hh=f.wall_mm[r][c];if(hh>.02){let x=wx-hh/1000-.001,y=-w/2+c*du,z=.105+r*dv;poly([[x,y,z],[x,y+du,z],[x,y+du,z+dv],[x,y,z+dv]],color(hh))}}let a=f.arm;for(let k=1;k<a.length;k++)line(a[k-1],a[k],'#ffd166',Math.max(2,C.width/500));a.forEach(p=>{let q=P(p);ctx.fillStyle='#e9b949';ctx.beginPath();ctx.arc(q[0],q[1],5,0,7);ctx.fill()});if(f.action){let u=f.tool_uv[0],v=f.tool_uv[1],ang=f.action.blade_angle_deg*Math.PI/180,L=.12,B=.03,ca=Math.cos(ang),sa=Math.sin(ang),pts=[];for(let [aa,bb] of [[-L/2,-B/2],[L/2,-B/2],[L/2,B/2],[-L/2,B/2]])pts.push([wx-.006,u+aa*ca-bb*sa,.105+v+aa*sa+bb*ca]);poly(pts,'rgba(245,245,245,.78)','#fff')}ctx.fillStyle='#d5e5ef';ctx.font=`${14*(devicePixelRatio||1)}px sans-serif`;ctx.fillText('拖动旋转 · 滚轮缩放',18,28)}
function heat(canvas,a){let d=size(canvas),x=canvas.getContext('2d'),nr=a.length,nc=a[0].length,cw=canvas.width/nc,ch=canvas.height/nr;x.clearRect(0,0,canvas.width,canvas.height);for(let r=0;r<nr;r++)for(let c=0;c<nc;c++){x.fillStyle=color(a[r][c]);x.fillRect(c*cw,canvas.height-(r+1)*ch,cw+.5,ch+.5)}}
const names={DECIDE:'策略决策',TRANSIT:'阶段间关节轨迹插值',LOAD_APPROACH:'回到装料位',DISPENSE:'等待随机装料',TOOL_INSPECT:'检查刀上积料',WALL_APPROACH:'接近墙面',CONTACT_ACQUIRE:'建立接触',WORK_STEP:'涂抹/刮平',WORK:'本刀结束',LIFT:'抬刀',RETREAT:'离墙',SCAN_RETURN:'返回扫描位',SCAN:'D435 深度扫描',FINISH:'完成判定'};function draw(){let f=F[i],m=f.metrics;draw3();heat($('wall'),f.wall_mm);heat($('blade'),f.blade_mm);$('phase').innerHTML=`<b>${names[f.phase]||f.phase}</b>　循环 ${f.cycle}${f.kinematic_ok?'':'　<span class=warn>该目标逆解失败</span>'}`;$('coverage').textContent=(m.coverage*100).toFixed(1)+'%';$('rmse').textContent=m.rmse_mm.toFixed(3)+' mm';$('mean').textContent=m.mean_thickness_mm.toFixed(3)+' mm';$('load').textContent=m.blade_load_ml.toFixed(1)+' mL';$('waste').textContent=(m.waste_frac*100).toFixed(1)+'%';$('steps').textContent=f.control_steps;$('count').textContent=`${i+1}/${F.length}`;$('seek').max=F.length-1;$('seek').value=i;$('action').textContent=f.action?`动作：${f.action.mode}；起点 (${f.action.start_uv_m.map(x=>x.toFixed(3))}) m → 终点 (${f.action.end_uv_m.map(x=>x.toFixed(3))}) m；刀角 ${f.action.blade_angle_deg.toFixed(1)}°；力 ${f.action.force_N.toFixed(1)} N；速度 ${f.action.speed_m_s.toFixed(3)} m/s`:'尚未生成动作'}
$('play').onclick=()=>{play=!play;$('play').textContent=play?'暂停':'播放'};$('restart').onclick=()=>{i=0;draw()};$('seek').oninput=()=>{play=false;i=+$('seek').value;draw()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(v==='front'){yaw=-Math.PI/2;pitch=0}else if(v==='side'){yaw=0;pitch=.08}else{yaw=-.65;pitch=.25}draw3()});C.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(drag){yaw+=(e.clientX-lx)*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-ly)*.008));lx=e.clientX;ly=e.clientY;draw3()}};C.onpointerup=()=>drag=false;C.onwheel=e=>{e.preventDefault();zoom=Math.max(250,Math.min(1800,zoom*Math.exp(-e.deltaY*.001)));draw3()};function tick(t){if(play&&t-last>120/+$('speed').value){i=(i+1)%F.length;last=t;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
